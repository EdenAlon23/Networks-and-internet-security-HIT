<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NetSec Study Hub · HIT</title>
<meta name="description" content="A study companion for the HIT course Network and Server Security (אבטחת רשתות ומשרתת) by Eden Alon: 11 chapters, packet-level explanations and step-by-step animations.">
<meta name="author" content="Eden Alon">
<meta property="og:title" content="NetSec Study Hub · HIT">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 8 5 13 12 15 7-2 12-7 12-15V7z' fill='%230f7c8c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar (brand · search · ask) + chapter rail + reading column; chapters load as fragments; ask panel slides in from the right */
:root{
  --bg:#f4f7f9; --surface:#ffffff; --ink:#13212c; --muted:#56687a; --line:#d3dce4;
  --accent:#0f7c8c; --accent-soft:#e0f1f3;
  --atk:#c2372f; --atk-soft:#fbe9e7; --def:#2e7d4f; --def-soft:#e4f3e9; --warn:#a66a00; --warn-soft:#fdf1dc;
  --code-bg:#ecf1f5; --rail:#eaf0f4;
  --f-display:"Space Grotesk","Segoe UI",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --f-mono:"JetBrains Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151b; --surface:#152029; --ink:#e2e9ef; --muted:#95a7b6; --line:#293845;
  --accent:#4fc3d2; --accent-soft:#16333a;
  --atk:#ff7a6e; --atk-soft:#3a1d1b; --def:#6fd39a; --def-soft:#15301f; --warn:#f2b54a; --warn-soft:#3a2c12;
  --code-bg:#1b2934; --rail:#111c24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#152029; --ink:#e2e9ef; --muted:#95a7b6; --line:#293845;
  --accent:#4fc3d2; --accent-soft:#16333a;
  --atk:#ff7a6e; --atk-soft:#3a1d1b; --def:#6fd39a; --def-soft:#15301f; --warn:#f2b54a; --warn-soft:#3a2c12;
  --code-bg:#1b2934; --rail:#111c24; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:.8rem;padding-block:.6rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.1rem;text-decoration:none;color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:.45rem}
.brand i{font-style:normal;font-family:var(--f-mono);font-size:.72rem;color:var(--surface);background:var(--accent);padding:.1rem .4rem;border-radius:4px}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.35rem .6rem;cursor:pointer}
.search{position:relative;flex:1;min-width:0;max-width:560px;margin-inline-start:auto}
.search input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.5rem .8rem .5rem 2.1rem}
.search svg{position:absolute;left:.65rem;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:min(70vh,520px);overflow:auto;padding:.35rem}
.res{display:block;width:100%;text-align:left;border:0;background:none;padding:.55rem .7rem;border-radius:8px;cursor:pointer;color:var(--ink)}
.res:hover,.res.sel{background:var(--accent-soft)}
.res b{display:block;font-weight:600;font-size:.95rem}
.res small{display:block;color:var(--muted);font-size:.82rem;line-height:1.45}
.res mark{background:var(--warn-soft);color:inherit;border-radius:3px;padding:0 .1em}
.res .k{font-family:var(--f-mono);font-size:.7rem;color:var(--accent);letter-spacing:.04em}
.res-empty{padding:.8rem;color:var(--muted);font-size:.9rem}
.ask-btn{border:0;background:var(--accent);color:var(--surface);border-radius:10px;padding:.5rem .9rem;font-weight:600;cursor:pointer;white-space:nowrap}

/* frame */
.frame{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 56px)}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:1rem .7rem 3rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);height:calc(100vh - 56px - env(safe-area-inset-top,0px));overflow:auto}
.rail h6{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:.4rem .5rem .5rem}
.rail a{display:grid;grid-template-columns:2.1rem 1fr;gap:.2rem;align-items:baseline;text-decoration:none;color:var(--ink);padding:.42rem .5rem;border-radius:8px;font-size:.92rem;line-height:1.35}
.rail a span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.rail a:hover{background:var(--surface)}
.rail a.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
.rail hr{border:0;border-top:1px solid var(--line);margin:.7rem .5rem}
main{min-width:0;padding-block:0 5rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}

/* chapter content (shared with fragments) */
.col{max-width:76ch}
header.top{padding-block:2.2rem 1.4rem;border-bottom:1px solid var(--line);margin-bottom:1.2rem}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,4.2vw,2.6rem);line-height:1.15;margin:.3rem 0 .6rem;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:600;font-size:1.5rem;margin:0 0 .6rem;text-wrap:balance;display:flex;gap:.6rem;align-items:baseline;scroll-margin-top:80px}
h2 .n{font-family:var(--f-mono);font-size:.85rem;color:var(--accent);font-weight:600}
h3{font-family:var(--f-display);font-weight:600;font-size:1.12rem;margin:1.4rem 0 .4rem}
p{margin:.5rem 0}
.lead{color:var(--muted);font-size:1.05rem;max-width:72ch}
section{padding-block:2rem;border-bottom:1px solid var(--line);scroll-margin-top:70px}
code,.mono{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:.05em .35em;border-radius:4px}
pre{font-family:var(--f-mono);background:var(--code-bg);padding:1rem;border-radius:8px;overflow-x:auto;font-size:.85rem;line-height:1.55}
pre code{background:none;padding:0}
ul,ol{padding-inline-start:1.3rem;margin:.4rem 0}
li{margin:.2rem 0}
nav.toc{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:1rem}
nav.toc a{font-size:.85rem;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:.2rem .6rem;border-radius:999px;background:var(--surface)}
nav.toc a:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin:1rem 0}
.grid>*{min-width:0}
.box{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.9rem 1.1rem}
.box h4{margin:0 0 .3rem;font-family:var(--f-display);font-size:1rem}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:.1rem .5rem;border-radius:4px;margin-bottom:.35rem}
.atk,.def,.real,.why,.steps{border-radius:8px;padding:.8rem 1rem;margin:1rem 0;border-inline-start:4px solid}
.atk{border-color:var(--atk);background:var(--atk-soft)} .atk .tag{background:var(--atk);color:var(--surface)}
.def{border-color:var(--def);background:var(--def-soft)} .def .tag{background:var(--def);color:var(--surface)}
.real{border-color:var(--warn);background:var(--warn-soft)} .real .tag{background:var(--warn);color:var(--surface)}
.why{border-color:var(--accent);background:var(--accent-soft)} .why .tag{background:var(--accent);color:var(--surface)}
.steps{border-color:var(--ink);background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--ink)} .steps .tag{background:var(--ink);color:var(--surface)}
figure{margin:1.2rem 0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem;overflow-x:auto}
figure svg{display:block;margin:0 auto;max-width:100%;height:auto}
figcaption{font-size:.85rem;color:var(--muted);margin-top:.5rem;text-align:center}
svg text{font-family:var(--f-body);fill:var(--ink)}
.tbl{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--surface)}
th,td{border:1px solid var(--line);padding:.45rem .65rem;text-align:start;vertical-align:top}
th{background:var(--code-bg);font-family:var(--f-display);font-weight:600}
td.num{font-variant-numeric:tabular-nums}
.src,.note{font-size:.84rem;color:var(--muted)}
.hdr-diag{font-family:var(--f-mono)}

/* header bit-diagrams */
.bits{display:grid;grid-template-columns:repeat(32,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:.74rem;background:var(--surface);min-width:640px}
.bits div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:.35rem .2rem;text-align:center;line-height:1.25;min-width:0}
.bits .sc{background:var(--code-bg);font-family:var(--f-mono);font-size:.62rem;color:var(--muted);padding:.15rem 0}
.bits .hot{background:var(--atk-soft)}
.bits .key{background:var(--accent-soft)}
.bits small{display:block;color:var(--muted);font-size:.66rem}
.bitwrap{overflow-x:auto;margin:1rem 0}

/* video strip */
.vids{margin:1.2rem 0 .4rem;padding:1rem;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.vids-h{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.7rem}
.vids-h h2{margin:0;font-size:1.2rem}
.vids-h p{margin:0;color:var(--muted);font-size:.88rem}
.vtabs{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.8rem}
.vtabs button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.25rem .7rem;font-size:.84rem;cursor:pointer}
.vtabs button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* animation player */
.ap-head{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.ap-kicker{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--atk)}
.ap-title{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.ap-body{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:.8rem;align-items:start}
.ap-stage{background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.ap-stage svg{display:block;width:100%;min-width:560px;height:auto}
.ap-link{stroke:var(--line);stroke-width:2.5;stroke-dasharray:6 5}
.ap-nl{font-family:var(--f-display);font-weight:600;font-size:14px}
.ap-ns{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.ap-node rect{stroke-width:1.6}
.ap-node.pulse rect{stroke-width:3.2}
@media (prefers-reduced-motion:no-preference){.ap-node.pulse rect{animation:pulse 1.1s ease-out 1}}
@keyframes pulse{0%{stroke-width:7}100%{stroke-width:3.2}}
.ap-pl{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--surface)}
.ap-x{font-family:var(--f-mono);font-size:12px;font-weight:700;fill:var(--atk)}
.ap-hdr{display:flex;flex-direction:column;gap:.5rem;max-height:340px;overflow:auto;min-width:0}
.ap-hbox{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.ap-ht{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:var(--code-bg);padding:.3rem .55rem;color:var(--muted)}
.ap-hbox table{font-size:.8rem;border:0}
.ap-hbox th,.ap-hbox td{border:0;border-top:1px solid var(--line);padding:.28rem .55rem;background:none;font-family:var(--f-mono);font-weight:400}
.ap-hbox th{color:var(--muted);width:42%;font-size:.74rem}
.ap-hbox tr.hl td{color:var(--atk);font-weight:600}
.ap-hbox tr.hl{background:var(--warn-soft)}
.ap-empty{color:var(--muted);font-size:.85rem;margin:.3rem 0}
.ap-say{margin:.7rem 0;min-height:3.4em;font-size:.97rem;line-height:1.6}
.ap-n{font-family:var(--f-mono);font-size:.72rem;color:var(--surface);background:var(--ink);padding:.1rem .45rem;border-radius:4px;margin-right:.3rem;white-space:nowrap}
.ap-ctr{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.ap-ctr button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.3rem .6rem;cursor:pointer;min-width:2.2rem}
.ap-ctr .ap-play{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600;min-width:6rem}
.ap-dots{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:120px}
.ap-dot{width:18px;height:8px;border-radius:4px;border:0!important;padding:0!important;min-width:0!important;background:var(--line)!important;cursor:pointer}
.ap-dot.done{background:var(--muted)!important}
.ap-dot.on{background:var(--accent)!important;width:28px}
.ap-spd{font-size:.82rem;color:var(--muted);display:flex;gap:.3rem;align-items:center}
.ap-spd select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:.15rem .3rem}

/* home */
.hero{padding-block:2.4rem 1.2rem}
.hero h1{max-width:20ch}
.cards{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin:1.2rem 0 2rem}
.card{display:flex;flex-direction:column;gap:.3rem;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.card:hover{border-color:var(--accent)}
.card .num{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.card b{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.card small{color:var(--muted);font-size:.85rem;line-height:1.45}
.card .meta{margin-top:auto;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.how{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.how div{border-top:2px solid var(--ink);padding-top:.5rem}
.how b{font-family:var(--f-display)}
.loading{color:var(--muted);padding:3rem 0}

/* ask panel */
.ask{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);z-index:40;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.ask-h{display:flex;align-items:center;gap:.6rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.ask-h b{font-family:var(--f-display);font-size:1.05rem;flex:1}
.ask-h button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:.25rem .6rem;cursor:pointer}
.ask-log{flex:1;overflow:auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.msg{border-radius:12px;padding:.6rem .8rem;font-size:.93rem;line-height:1.6;max-width:100%;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--surface);max-width:85%}
.msg.c{background:var(--bg);border:1px solid var(--line)}
.msg.c pre{font-size:.78rem;padding:.6rem}
.msg.c p{margin:.35rem 0}
.msg .srcs{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.msg .srcs a{font-size:.75rem;font-family:var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:.05rem .5rem;text-decoration:none;background:var(--surface)}
.msg.err{background:var(--atk-soft);border:1px solid var(--atk)}
.sugs{display:flex;flex-direction:column;gap:.4rem}
.sugs button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.45rem .7rem;cursor:pointer;font-size:.88rem}
.sugs button:hover{border-color:var(--accent)}
.ask-f{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:1px solid var(--line)}
.ask-f textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:.5rem .7rem;font:inherit;min-height:2.6rem;max-height:8rem}
.ask-f button{border:0;background:var(--accent);color:var(--surface);border-radius:10px;padding:0 1rem;font-weight:600;cursor:pointer}
.ask-f button.stop{background:var(--atk)}
.ask-note{font-size:.75rem;color:var(--muted);padding:0 1rem .6rem}

@media (max-width:1000px){.ap-body{grid-template-columns:minmax(0,1fr)}.ap-hdr{max-height:none;flex-direction:row;flex-wrap:wrap}.ap-hbox{flex:1 1 220px}}
@media (max-width:860px){
  .frame{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:inline-block}
  .rail{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:0;bottom:0;height:auto;width:min(300px,85vw);z-index:25;box-shadow:12px 0 40px rgba(0,0,0,.18);padding-left:max(.7rem,env(safe-area-inset-left,0px))}
  .rail.open{display:block}
  .brand span{display:none}
  .ask-btn{padding:.5rem .7rem}
}
@media (max-width:520px){.ask-btn .lbl{display:none}}

.intro{display:grid;gap:1.4rem;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start;padding-block:2.4rem 1rem}
.intro h1{margin:.2rem 0 .8rem}
.intro .he{font-family:var(--f-body);font-weight:600;direction:rtl;unicode-bidi:isolate}
.author{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem}
.author .who{font-family:var(--f-display);font-size:1.3rem;font-weight:700;margin:.2rem 0}
.author dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem .8rem;margin:.6rem 0 0;font-size:.92rem}
.author dt{color:var(--muted)} .author dd{margin:0}
.stats{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0 0}
.stats span{font-family:var(--f-mono);font-size:.8rem;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:.25rem .7rem}
.wrap section.subj{margin:2rem 0 0;padding:0;border:0;min-height:0;content-visibility:visible}
.subj-h{display:flex;align-items:baseline;gap:.7rem;border-bottom:1px solid var(--line);padding-bottom:.4rem}
.subj-h .num{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.subj-h h2{margin:0;font-size:1.25rem}
.subj-h p{margin:0 0 0 auto;color:var(--muted);font-size:.9rem}
.subj .cards{margin:.8rem 0 0}
.disclaimer{margin:2.4rem 0 2rem;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem}
.rail .grp{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:.9rem .5rem .2rem}
@media (max-width:820px){.intro{grid-template-columns:1fr}.subj-h{flex-wrap:wrap}.subj-h p{margin:0;flex-basis:100%}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="context-stroke"/></marker></defs></svg>

<div class="bar"><div class="bar-in">
  <button class="menu-btn" id="menuBtn" type="button" aria-label="Chapters" aria-expanded="false">☰</button>
  <a class="brand" href="#home"><i>HIT</i><span>NetSec Study Hub</span></a>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>

</aside>

<script src="anim.js"></script>
<script>
(function(){
'use strict';
const CH = [
  {id:'00',file:'00-packets.html',t:'Packet foundations',d:'Ethernet, ARP, IPv4, fragmentation, ICMP, TCP, UDP, DNS: every header field and why it exists.'},
  {id:'01',file:'01-intro.html',t:'Intro to cyber security',d:'CIA, threats vs vulnerabilities, attack phases, defense in depth.'},
  {id:'02',file:'02-osint.html',t:'OSINT and reconnaissance',d:'Footprinting, whois, DNS, Google dorks, Shodan, social engineering.'},
  {id:'03',file:'03-scanning.html',t:'Scanning',d:'Host discovery, every nmap scan type at packet level, OS fingerprinting, banners.'},
  {id:'04',file:'04-sniffing.html',t:'Sniffing and poisoning',d:'Hubs vs switches, MAC flooding, ARP, DHCP and DNS poisoning.'},
  {id:'05',file:'05-dos.html',t:'DoS and DDoS',d:'SYN flood, Smurf, amplification, fragment attacks, botnets, mitigation.'},
  {id:'06',file:'06-symmetric.html',t:'Symmetric cryptography',d:'Classical ciphers, DES/3DES/AES, block modes, key distribution.'},
  {id:'07',file:'07-public-key.html',t:'Public-key cryptography',d:'Diffie-Hellman, RSA, signatures, hashes, certificates and PKI.'},
  {id:'08',file:'08-email.html',t:'Email security',d:'SMTP path, PGP step by step, S/MIME, SPF, DKIM, DMARC.'},
  {id:'09',file:'09-firewalls.html',t:'Firewalls and access control',d:'Stateless vs stateful, proxies, DMZ designs, NAT, iptables, ACL and RBAC.'},
  {id:'10',file:'10-tools.html',t:'Tools lab',d:'What each tool does, what it puts on the wire, how to read its output, how they combine.'}
];
const SUBJ = [
  {t:'Foundations',d:'How packets travel and what security means',ch:['00','01']},
  {t:'Reconnaissance',d:'Finding out what exists before touching it',ch:['02','03']},
  {t:'Attacks on the network',d:'Abusing LAN protocols and exhausting resources',ch:['04','05']},
  {t:'Cryptography',d:'Secret keys, public keys, and securing email',ch:['06','07','08']},
  {t:'Defense and practice',d:'Firewalls, access control and the tools lab',ch:['09','10']}
];
const $ = (s, r) => (r || document).querySelector(s);
const main = $('#main'), rail = $('#rail');
const cache = {};
let player = null;

// ---------- rail ----------
rail.innerHTML = '<a href="#home" data-ch="home"><span>⌂</span>Introduction</a>' + SUBJ.map(g => '<div class="grp">' + esc(g.t) + '</div>' + g.ch.map(id => { const c = getCh(id); return '<a href="#ch-' + c.id + '" data-ch="' + c.id + '"><span>' + c.id + '</span>' + esc(c.t) + '</a>'; }).join('')).join('') + '<hr><a href="#videos" data-ch="videos"><span>▶</span>All animations</a>';
$('#menuBtn').onclick = () => { const o = rail.classList.toggle('open'); $('#menuBtn').setAttribute('aria-expanded', o); };
rail.addEventListener('click', e => { if (e.target.closest('a')) rail.classList.remove('open'); });

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function getCh(id){ return CH.find(c => c.id === id); }
async function load(id){
  if (cache[id]) return cache[id];
  const c = getCh(id); const r = await fetch('ch/' + c.file); if (!r.ok) throw new Error('HTTP ' + r.status);
  cache[id] = await r.text(); return cache[id];
}
function setOn(key){ rail.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.ch === key)); }
function stopPlayer(){ if (player) { player.destroy(); player = null; } }

// ---------- views ----------
function home(){
  stopPlayer(); setOn('home');
  const n = Anim.scenarios.length;
  main.innerHTML = '<div class="wrap"><section class="intro" aria-label="Introduction"><div>'
   + '<div class="eyebrow">HIT · Holon Institute of Technology</div>'
   + '<h1>Network and Server Security, packet by packet.</h1>'
   + '<p class="lead">A study companion for the course <span class="he" lang="he">אבטחת רשתות ומשרתת</span> (Network and Server Security). It explains every topic down to where each packet goes, which headers it carries and why, and the exact steps of every protocol, attack and defense.</p>'
   + '<div class="stats"><span>11 chapters</span><span>5 subjects</span><span>' + n + ' packet animations</span><span>search across everything</span></div></div>'
   + '<aside class="author"><div class="eyebrow">Created by</div><div class="who">Eden Alon</div><p class="note" style="margin:.2rem 0 0">Computer Science, 3rd year</p><dl><dt>Course</dt><dd><span class="he" lang="he">אבטחת רשתות ומשרתת</span></dd><dt>Institute</dt><dd>HIT, Holon Institute of Technology</dd><dt>Purpose</dt><dd>A helping tool for studying the course</dd><dt>GitHub</dt><dd><a href="https://github.com/EdenAlon23">EdenAlon23</a></dd></dl></aside></section>'
   + '<div class="how"><div><b>Start with 00</b><p class="note">Packet foundations explains each header field once; later chapters show how each field is used and abused.</p></div><div><b>Watch, then read</b><p class="note">Each chapter opens with its animations. Pause on any step to read the exact header values.</p></div><div><b>Search</b><p class="note">Press / and type any term: a header field, a port, an attack, a tool.</p></div></div>'
   + SUBJ.map((g, i) => '<section class="subj"><div class="subj-h"><span class="num">SUBJECT ' + (i + 1) + '</span><h2>' + esc(g.t) + '</h2><p>' + esc(g.d) + '</p></div><div class="cards">' + g.ch.map(id => { const c = getCh(id), k = Anim.byChapter(c.id).length; return '<a class="card" href="#ch-' + c.id + '"><span class="num">CHAPTER ' + c.id + '</span><b>' + esc(c.t) + '</b><small>' + esc(c.d) + '</small><span class="meta">' + (k ? k + ' animation' + (k > 1 ? 's' : '') : 'reading') + '</span></a>'; }).join('') + '</div></section>').join('')
   + '<p class="disclaimer">An independent study aid written by a student, not official course material and not affiliated with or endorsed by HIT or the course staff. The explanations are original summaries of the course topics; real-world notes marked as additions go beyond the slides. Tools are described for learning and for authorized lab use only.</p></div>';
  window.scrollTo(0, 0);
}
function vidStrip(list, startId){
  const box = document.createElement('div'); box.className = 'vids';
  box.innerHTML = '<div class="vids-h"><h2>▶ Animations</h2><p>Press Play to watch, or step through with ⏮ ⏭. The right panel shows the real header fields at each step.</p></div><div class="vtabs"></div><div class="vplayer"></div>';
  const tabs = $('.vtabs', box), host = $('.vplayer', box);
  const pick = (id) => { stopPlayer(); tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === id)); player = Anim.mount(host, id); };
  list.forEach(s => { const b = document.createElement('button'); b.type = 'button'; b.dataset.id = s.id; b.textContent = s.title; b.onclick = () => pick(s.id); tabs.appendChild(b); });
  if (list.length < 2) tabs.hidden = true;
  setTimeout(() => pick(startId && list.some(s => s.id === startId) ? startId : list[0].id));
  return box;
}
async function chapter(id, sec){
  stopPlayer(); setOn(id);
  const c = getCh(id); if (!c) return home();
  main.innerHTML = '<div class="wrap loading">Loading chapter ' + id + '…</div>';
  let html; try { html = await load(id); } catch (e) { main.innerHTML = '<div class="wrap loading">Could not load this chapter (' + esc(e.message) + '). Refresh the page to try again.</div>'; return; }
  const w = document.createElement('div'); w.className = 'wrap'; w.innerHTML = html;
  main.innerHTML = ''; main.appendChild(w);
  const list = Anim.byChapter(id);
  if (list.length) { const top = $('header.top', w); const strip = vidStrip(list); top ? top.after(strip) : w.prepend(strip); }
  w.querySelectorAll('script').forEach(old => { const s = document.createElement('script'); s.textContent = old.textContent; old.replaceWith(s); });
  if (sec) { const t = w.querySelector('#' + CSS.escape(sec)); if (t) { t.scrollIntoView(); return; } }
  window.scrollTo(0, 0);
}
function videos(start){
  stopPlayer(); setOn('videos');
  const w = document.createElement('div'); w.className = 'wrap';
  w.innerHTML = '<header class="top"><div class="eyebrow">All animations</div><h1>Packet animations</h1><p class="lead">Every scenario from every chapter. Pick one below.</p></header>';
  main.innerHTML = ''; main.appendChild(w);
  w.appendChild(vidStrip(Anim.scenarios, start));
  const idx = document.createElement('div'); idx.className = 'tbl';
  idx.innerHTML = '<table><thead><tr><th>Chapter</th><th>Animation</th></tr></thead><tbody>' + Anim.scenarios.map(s => '<tr><td class="num">' + s.ch + ' · ' + esc(getCh(s.ch).t) + '</td><td><a href="#v-' + s.id + '">' + esc(s.title) + '</a></td></tr>').join('') + '</tbody></table>';
  w.appendChild(idx);
  window.scrollTo(0, 0);
}
function route(){
  const h = location.hash.slice(1);
  if (!h || h === 'home') return home();
  if (h === 'videos') return videos();
  if (h.startsWith('v-')) return videos(h.slice(2));
  const m = h.match(/^ch-(\d\d)(?:--(.+))?$/);
  if (m) return chapter(m[1], m[2]);
  home();
}
window.addEventListener('hashchange', route);
// in-chapter anchors (#why) → scroll inside current chapter, keep the route
main.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]'); if (!a) return;
  const h = a.getAttribute('href').slice(1);
  if (/^(ch-|v-|home$|videos$)/.test(h)) return;
  const t = main.querySelector('#' + CSS.escape(h)); if (t) { e.preventDefault(); t.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }
});
route();

// ---------- search index ----------
const IDX = []; let idxReady = false;
async function buildIndex(){
  await Promise.all(CH.map(async c => {
    try {
      const html = await load(c.id);
      const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
      doc.querySelectorAll('section[id]').forEach(s => {
        const h = s.querySelector('h2'); const title = h ? h.textContent.replace(/^\s*\d+\s*/, '').trim() : s.id;
        const text = s.textContent.replace(/\s+/g, ' ').trim();
        IDX.push({ kind: 'sec', ch: c.id, id: s.id, title, text, lt: title.toLowerCase(), lx: text.toLowerCase() });
      });
    } catch (e) { /* chapter unavailable: skip in search */ }
  }));
  Anim.scenarios.forEach(s => { const text = s.steps.map(x => x.say.replace(/<[^>]+>/g, '')).join(' ') + ' ' + s.steps.map(x => (x.h || []).map(h => h.t + ' ' + h.f.map(f => f.join(' ')).join(' ')).join(' ')).join(' ');
    IDX.push({ kind: 'vid', ch: s.ch, id: s.id, title: s.title, text, lt: s.title.toLowerCase(), lx: text.toLowerCase() }); });
  idxReady = true;
}
const idxP = buildIndex();
function terms(q){ return q.toLowerCase().split(/[^a-z0-9֐-׿.\/-]+/).filter(t => t.length > 1); }
function search(q, n){
  const ts = terms(q); if (!ts.length) return [];
  const out = [];
  IDX.forEach(it => {
    let sc = 0, hit = 0;
    ts.forEach(t => { const inT = it.lt.includes(t); let c = 0, p = it.lx.indexOf(t); while (p !== -1 && c < 20) { c++; p = it.lx.indexOf(t, p + t.length); } if (inT || c) hit++; sc += (inT ? 8 : 0) + Math.min(c, 8); });
    if (!hit) return;
    sc *= hit / ts.length; if (hit === ts.length) sc *= 1.6; if (it.kind === 'vid') sc *= 0.9;
    out.push({ it, sc });
  });
  out.sort((a, b) => b.sc - a.sc);
  return out.slice(0, n || 12).map(o => o.it);
}
function snippet(it, q){
  const ts = terms(q); let p = -1;
  for (const t of ts) { p = it.lx.indexOf(t); if (p !== -1) break; }
  const s = Math.max(0, p - 60), raw = (s > 0 ? '…' : '') + it.text.slice(s, s + 170) + '…';
  let h = esc(raw);
  ts.forEach(t => { h = h.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); });
  return h;
}
const qEl = $('#q'), res = $('#results'); let sel = -1, cur = [];
function hrefOf(it){ return it.kind === 'vid' ? '#v-' + it.id : '#ch-' + it.ch + '--' + it.id; }
function showRes(){
  const q = qEl.value.trim(); sel = -1;
  if (!q) { res.hidden = true; return; }
  cur = search(q, 12);
  if (!cur.length) { res.innerHTML = '<div class="res-empty">' + (idxReady ? 'No matches. Try another term, or ask the question.' : 'Still indexing chapters…') + '</div>'; res.hidden = false; return; }
  res.innerHTML = cur.map((it, k) => '<button class="res" type="button" data-k="' + k + '"><span class="k">' + (it.kind === 'vid' ? '▶ ANIMATION · CH ' : 'CH ') + it.ch + ' · ' + esc(getCh(it.ch).t) + '</span><b>' + esc(it.title) + '</b><small>' + snippet(it, q) + '</small></button>').join('');
  res.hidden = false;
}
function openRes(k){ const it = cur[k]; if (!it) return; res.hidden = true; qEl.blur(); const h = hrefOf(it); if (location.hash === h) route(); else location.hash = h; }
qEl.addEventListener('input', showRes);
qEl.addEventListener('focus', () => { if (qEl.value.trim()) showRes(); });
qEl.addEventListener('keydown', e => {
  const bs = res.querySelectorAll('.res');
  if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(sel + 1, bs.length - 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(sel - 1, 0); }
  else if (e.key === 'Enter') { e.preventDefault(); openRes(sel < 0 ? 0 : sel); return; }
  else if (e.key === 'Escape') { res.hidden = true; return; } else return;
  bs.forEach((b, k) => b.classList.toggle('sel', k === sel)); if (bs[sel]) bs[sel].scrollIntoView({block: 'nearest'});
});
res.addEventListener('click', e => { const b = e.target.closest('.res'); if (b) openRes(+b.dataset.k); });
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); qEl.focus(); } });

// ---------- ask Claude ----------
const ask = $('#ask'), log = $('#askLog'), form = $('#askForm'), inp = $('#askIn'), send = $('#askSend');
let sample = null, sampleChecked = false, turns = [], ctl = null, busy = false;
const SUGS = ['How does a router fragment a packet and how does the receiver reassemble it?', 'Walk me through an idle scan packet by packet, with the IP ID values.', 'Which header fields does ARP poisoning forge, and how does Dynamic ARP Inspection stop it?', 'What is the difference between a stateless and a stateful firewall for a SYN flood?'];
function intro(){
  log.innerHTML = '';
  const m = document.createElement('div'); m.className = 'msg c';
  m.innerHTML = '<p>Ask anything about the course. I look up the most relevant sections of these notes and answer from them, down to header fields and exact steps.</p>';
  const s = document.createElement('div'); s.className = 'sugs';
  SUGS.forEach(q => { const b = document.createElement('button'); b.type = 'button'; b.textContent = q; b.onclick = () => { inp.value = q; form.requestSubmit(); }; s.appendChild(b); });
  log.append(m, s);
}
intro();
window.claude && window.claude.use && window.claude.use('sample').then(s => { sample = s; sampleChecked = true; if (!s) unavailable(); }).catch(() => { sampleChecked = true; unavailable(); });
if (!window.claude) { sampleChecked = true; $('#askBtn').hidden = true; setTimeout(unavailable); }
function unavailable(){ $('#askNote').textContent = 'Asking questions works when this page is opened on claude.ai while signed in. Search still works everywhere.'; inp.disabled = true; send.disabled = true; }
function openAsk(){ ask.hidden = false; setTimeout(() => inp.focus(), 30); }
$('#askBtn').onclick = () => ask.hidden ? openAsk() : (ask.hidden = true);
$('#askClose').onclick = () => { ask.hidden = true; };
$('#askNew').onclick = () => { if (ctl) ctl.abort(); turns = []; intro(); };
inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
inp.addEventListener('input', () => { inp.style.height = 'auto'; inp.style.height = Math.min(inp.scrollHeight, 128) + 'px'; });

function md(t){
  const blocks = []; let s = t.replace(/```[a-z]*\n?([\s\S]*?)```/g, (_, c) => { blocks.push(c); return '\u0000' + (blocks.length - 1) + '\u0000'; });
  s = esc(s);
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  const lines = s.split('\n'); let out = '', inL = false, inO = false;
  const close = () => { if (inL) { out += '</ul>'; inL = false; } if (inO) { out += '</ol>'; inO = false; } };
  lines.forEach(l => {
    let m;
    if ((m = l.match(/^\s*[-*]\s+(.*)/))) { if (inO) close(); if (!inL) { out += '<ul>'; inL = true; } out += '<li>' + m[1] + '</li>'; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (inL) close(); if (!inO) { out += '<ol>'; inO = true; } out += '<li>' + m[1] + '</li>'; }
    else if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); out += '<p><b>' + m[1] + '</b></p>'; }
    else if (l.trim() === '') { close(); }
    else { close(); out += '<p>' + l + '</p>'; }
  });
  close();
  return out.replace(/<p>\u0000(\d+)\u0000<\/p>|\u0000(\d+)\u0000/g, (_, a, b) => '<pre>' + esc(blocks[+(a || b)]) + '</pre>');
}
function currentChapter(){ const m = location.hash.match(/^#ch-(\d\d)/); return m ? m[1] : null; }
function contextFor(q){
  let hits = search(q, 8).filter(h => h.kind === 'sec');
  const here = currentChapter();
  if (here) { const extra = search(q + ' ' + getCh(here).t, 4).filter(h => h.kind === 'sec' && h.ch === here); extra.forEach(x => { if (!hits.includes(x)) hits.unshift(x); }); }
  hits = hits.slice(0, 6);
  const vids = search(q, 6).filter(h => h.kind === 'vid').slice(0, 2);
  return { hits, vids };
}
const RULES = 'You are a tutor for a university course "Network and Server Security" (HIT, Israel). The lecturer requires packet-level understanding: where each packet goes, which headers and fields it carries and why, and the exact steps of each protocol, attack and defense.\n'
 + 'Answer in clear English (if the student writes Hebrew, answer in Hebrew and keep technical terms in English). Use the COURSE NOTES provided with each question as the primary source; if you add knowledge beyond them, say so briefly. Prefer numbered steps and concrete header field values. For attack topics, explain mechanics and defenses at the level of a university course and a lab environment. Keep answers focused (usually under 350 words). Use simple Markdown: **bold**, `code`, lists, and ``` blocks for headers or commands.';
async function ask_(q){
  if (busy || !q.trim()) return;
  if (log.querySelector('.sugs')) log.querySelector('.sugs').remove();
  const u = document.createElement('div'); u.className = 'msg u'; u.textContent = q; log.appendChild(u);
  const a = document.createElement('div'); a.className = 'msg c'; a.innerHTML = '<p>Thinking…</p>'; log.appendChild(a);
  log.scrollTop = log.scrollHeight;
  if (!idxReady) await idxP;
  const { hits, vids } = contextFor(q);
  const notes = hits.map(h => '[Chapter ' + h.ch + ' – ' + getCh(h.ch).t + ' › ' + h.title + ']\n' + h.text.slice(0, 3200)).join('\n\n')
    + (vids.length ? '\n\n' + vids.map(v => '[Animation: ' + v.title + ']\n' + v.text.slice(0, 1500)).join('\n\n') : '');
  const userTurn = 'COURSE NOTES (most relevant sections):\n' + (notes || '(no matching section)') + '\n\nQUESTION: ' + q;
  const msgs = [{ role: 'user', content: RULES }].concat(turns.slice(-6)).concat([{ role: 'user', content: userTurn }]);
  busy = true; ctl = new AbortController(); send.textContent = 'Stop'; send.classList.add('stop');
  try {
    const r = await sample(msgs, { cache: false, signal: ctl.signal, onText: ({ text }) => { a.innerHTML = md(text); log.scrollTop = log.scrollHeight; } });
    a.innerHTML = md(r.text) + (r.truncated ? '<p class="note">(Answer was cut short. Ask a narrower question for the rest.)</p>' : '');
    turns.push({ role: 'user', content: q }, { role: 'assistant', content: r.text });
    const links = hits.slice(0, 4).map(h => '<a href="#ch-' + h.ch + '--' + esc(h.id) + '">' + h.ch + ' · ' + esc(h.title) + '</a>').concat(vids.map(v => '<a href="#v-' + v.id + '">▶ ' + esc(v.title) + '</a>'));
    if (links.length) { const d = document.createElement('div'); d.className = 'srcs'; d.innerHTML = links.join(''); a.appendChild(d); }
  } catch (e) {
    const code = e && e.code;
    if (code === 'cancelled') { a.innerHTML = e.text ? md(e.text) + '<p class="note">(stopped)</p>' : '<p class="note">Stopped.</p>'; }
    else if (code === 'not_granted' || code === 'sampling_disabled' || code === 'capability_disabled' || code === 'not_declared') { a.className = 'msg c err'; a.textContent = 'Asking Claude is not allowed for this page in this view. Search still works.'; unavailable(); }
    else if (code === 'rate_limited') { a.className = 'msg c err'; a.textContent = 'Too many questions right now. Wait a moment, then ask again.'; }
    else if (code === 'refused') { a.className = 'msg c err'; a.textContent = 'Claude declined this question. Try rephrasing it around how the protocol or the defense works.'; }
    else { a.className = 'msg c err'; a.innerHTML = (e && e.text ? md(e.text) : '') + '<p>The answer was interrupted. Send the question again to retry.</p>'; }
  } finally { busy = false; ctl = null; send.textContent = 'Ask'; send.classList.remove('stop'); log.scrollTop = log.scrollHeight; }
}
form.addEventListener('submit', e => { e.preventDefault(); if (busy) { if (ctl) ctl.abort(); return; } if (!sample) return; const q = inp.value; inp.value = ''; inp.style.height = 'auto'; ask_(q); });
})();
</script>
